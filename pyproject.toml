[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-cull-mvp"
version = "0.4.1"
description = "Local contact-sheet based photo culling assistant"
readme = "README.md"
authors = [{name = "OpenAI"}]
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.10.0,<5",
]

[project.optional-dependencies]
raw = [
    "rawpy>=0.22.0",
    "ExifRead>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
aicull = "ai_cull_assistant.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_cull_assistant = ["data/*.onnx", "data/*.txt"]
